<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sala — chat, voz e tela</title>
<style>
  :root {
    --bg: #0a0e1a;
    --bg-panel: #0f1526;
    --bg-raised: #151d33;
    --line: #1e2a4a;
    --text: #e6e9ef;
    --text-dim: #7a85a0;
    --signal: #ff69b4;
    --signal-dim: #3d1a30;
    --accent: #ff1493;
    --danger: #ff3b5c;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* ---------- Tela de entrada ---------- */
  #tela-entrada {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,105,180,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,20,147,0.06), transparent 40%),
      var(--bg);
  }
  .cartao-entrada {
    width: 340px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px;
  }
  .cartao-entrada h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 4px;
    font-weight: 600;
  }
  .cartao-entrada .sub {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 24px;
  }
  .campo { margin-bottom: 14px; }
  .campo label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .campo input {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
  }
  .campo input:focus { border-color: var(--signal); }
  #btn-entrar {
    width: 100%;
    margin-top: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 11px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: filter 0.15s;
  }
  #btn-entrar:hover { filter: brightness(1.08); }
  #erro-entrada { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 14px; }

  /* ---------- App principal ---------- */
  #app { display: none; height: 100vh; flex-direction: column; }

  #barra-topo {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--line);
  }
  #barra-topo .info-sala {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ponto-vivo {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 3px var(--signal-dim);
  }
  #contagem { font-size: 12px; color: var(--text-dim); }

  #corpo { flex: 1; display: flex; min-height: 0; }

  /* Painel de vídeo/tela */
  #painel-video {
    flex: 1;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    align-content: start;
    overflow-y: auto;
  }
  .quadro-video {
    position: relative;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 8px;
    aspect-ratio: 16/9;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .quadro-video video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #05070a;
  }
  .quadro-video .rotulo {
    position: absolute;
    bottom: 8px; left: 10px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text);
    background: rgba(0,0,0,0.55);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .quadro-video.sem-video {
    flex-direction: column;
    gap: 8px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .avatar-letra {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: var(--signal);
  }

  /* Chat lateral */
  #painel-chat {
    width: 300px;
    flex-shrink: 0;
    border-left: 1px solid var(--line);
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
  }
  #mensagens {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { font-size: 13px; line-height: 1.4; }
  .msg .nome {
    font-weight: 700;
    color: var(--signal);
    font-size: 12px;
    margin-right: 6px;
  }
  .msg .hora {
    color: var(--text-dim);
    font-size: 10px;
    margin-left: 6px;
  }
  .msg.sistema { color: var(--text-dim); font-style: italic; font-size: 12px; }
  #form-chat {
    display: flex;
    border-top: 1px solid var(--line);
    padding: 10px;
    gap: 8px;
  }
  #input-chat {
    flex: 1;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  #input-chat:focus { border-color: var(--signal); }
  #form-chat button {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #form-chat button:hover { border-color: var(--signal); }

  /* Barra de controles */
  #barra-controles {
    height: 66px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--bg-panel);
    border-top: 1px solid var(--line);
  }
  .botao-controle {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: background 0.15s, border-color 0.15s;
  }
  .botao-controle:hover { border-color: var(--text-dim); }
  .botao-controle.ativo {
    background: var(--signal-dim);
    border-color: var(--signal);
    color: var(--signal);
  }
  .botao-controle.sair {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .botao-controle.sair:hover { filter: brightness(1.1); }
  .botao-controle.entrar-call {
    width: auto;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 13px;
    font-weight: 700;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    gap: 6px;
  }
  .botao-controle.entrar-call:hover { filter: brightness(1.12); }
  .controles-call-ocultos { display: none !important; }
</style>
</head>
<body>

<!-- ===== Tela de entrada ===== -->
<div id="tela-entrada">
  <div class="cartao-entrada">
    <h1>entrar na sala</h1>
    <p class="sub">chat · voz · compartilhar tela</p>
    <div class="campo">
      <label for="input-nome">seu nome</label>
      <input id="input-nome" type="text" maxlength="20" placeholder="ex: joão" autocomplete="off">
    </div>
    <div class="campo">
      <label for="input-sala">código da sala</label>
      <input id="input-sala" type="text" maxlength="24" placeholder="ex: casa123" autocomplete="off">
    </div>
    <button id="btn-entrar">entrar</button>
    <div id="erro-entrada"></div>
  </div>
</div>

<!-- ===== App ===== -->
<div id="app">
  <div id="barra-topo">
    <div class="info-sala">
      <span class="ponto-vivo"></span>
      <span id="rotulo-sala"></span>
    </div>
    <div id="contagem">1 pessoa na sala</div>
  </div>

  <div id="corpo">
    <div id="painel-video"></div>
    <div id="painel-chat">
      <div id="mensagens"></div>
      <form id="form-chat">
        <input id="input-chat" type="text" placeholder="mensagem..." autocomplete="off">
        <button type="submit">enviar</button>
      </form>
    </div>
  </div>

  <div id="barra-controles">
    <button class="botao-controle entrar-call" id="btn-entrar-call" title="entrar na chamada de voz">🎧 entrar na call</button>
    <span id="controles-call" class="controles-call-ocultos" style="display:contents">
      <button class="botao-controle" id="btn-mic" title="microfone">🎤</button>
      <button class="botao-controle" id="btn-tela" title="compartilhar tela">🖥️</button>
      <button class="botao-controle sair" id="btn-sair-call" title="sair da call">📵</button>
    </span>
    <button class="botao-controle sair" id="btn-sair" title="sair da sala">✕</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const socket = io();

  // ---------- Estado ----------
  let meuNome = '';
  let minhaSala = '';
  let streamMic = null;      // MediaStream do microfone (áudio local)
  let streamTela = null;     // MediaStream da tela compartilhada (se ativo)
  let naCall = false;        // se está na chamada de voz
  const conexoes = {};       // socketId -> RTCPeerConnection
  const streamsRemotos = {}; // socketId -> MediaStream combinada recebida
  const nomesRemotos = {};   // socketId -> nome

  const configIce = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  // ---------- Elementos ----------
  const telaEntrada = document.getElementById('tela-entrada');
  const appEl = document.getElementById('app');
  const inputNome = document.getElementById('input-nome');
  const inputSala = document.getElementById('input-sala');
  const btnEntrar = document.getElementById('btn-entrar');
  const erroEntrada = document.getElementById('erro-entrada');
  const rotuloSala = document.getElementById('rotulo-sala');
  const contagem = document.getElementById('contagem');
  const painelVideo = document.getElementById('painel-video');
  const mensagens = document.getElementById('mensagens');
  const formChat = document.getElementById('form-chat');
  const inputChat = document.getElementById('input-chat');
  const btnMic = document.getElementById('btn-mic');
  const btnTela = document.getElementById('btn-tela');
  const btnSair = document.getElementById('btn-sair');
  const btnEntrarCall = document.getElementById('btn-entrar-call');
  const btnSairCall = document.getElementById('btn-sair-call');
  const controlesCall = document.getElementById('controles-call');

  // ---------- Entrada na sala (somente chat, sem microfone obrigatório) ----------
  btnEntrar.addEventListener('click', entrarNaSala);
  inputSala.addEventListener('keydown', e => { if (e.key === 'Enter') entrarNaSala(); });

  function entrarNaSala() {
    const nome = inputNome.value.trim();
    const sala = inputSala.value.trim().toLowerCase().replace(/\s+/g, '-');
    if (!nome || !sala) {
      erroEntrada.textContent = 'preencha seu nome e o código da sala.';
      return;
    }

    meuNome = nome;
    minhaSala = sala;

    telaEntrada.style.display = 'none';
    appEl.style.display = 'flex';
    rotuloSala.textContent = sala;

    // Entra na sala apenas para chat — sem pedir mic, sem WebRTC
    socket.emit('entrar-sala', { sala, nome });
  }

  // ---------- Entrar na call de voz (manualmente) ----------
  btnEntrarCall.addEventListener('click', async () => {
    if (naCall) return;

    // Tenta pegar o microfone, mas se não conseguir, entra mudo
    try {
      streamMic = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      streamMic.getAudioTracks().forEach(t => t.enabled = true);
      micAtivo = true;
      btnMic.classList.add('ativo');
      btnMic.textContent = '🎤';
    } catch (e) {
      // Sem microfone — entra mudo, sem problemas
      streamMic = null;
      micAtivo = false;
      btnMic.classList.remove('ativo');
      btnMic.textContent = '🔇';
    }

    naCall = true;
    btnEntrarCall.classList.add('controles-call-ocultos');
    controlesCall.classList.remove('controles-call-ocultos');

    adicionarMensagemSistema('você entrou na chamada de voz.');

    // Inicia conexões WebRTC com quem já está na sala
    // Pede a lista de usuários novamente para conectar
    const usuariosNaSala = Object.keys(nomesRemotos);
    usuariosNaSala.forEach(id => {
      if (!conexoes[id]) {
        criarConexao(id, nomesRemotos[id], true);
      }
    });
  });

  // ---------- Sair da call (sem sair da sala) ----------
  btnSairCall.addEventListener('click', () => {
    sairDaCall();
  });

  function sairDaCall() {
    if (!naCall) return;
    naCall = false;

    // Fecha todas as conexões WebRTC
    Object.keys(conexoes).forEach(id => {
      conexoes[id].close();
      delete conexoes[id];
      delete streamsRemotos[id];
      removerQuadro(id);
    });

    // Para o microfone
    if (streamMic) {
      streamMic.getTracks().forEach(t => t.stop());
      streamMic = null;
    }

    // Para compartilhamento de tela
    pararCompartilhamentoTela();

    removerQuadro('local');

    btnEntrarCall.classList.remove('controles-call-ocultos');
    controlesCall.classList.add('controles-call-ocultos');

    adicionarMensagemSistema('você saiu da chamada de voz.');
  }

  // ---------- Quadro de vídeo ----------
  function criarOuAtualizarQuadro(id, nome, stream, ehTelaCompartilhada) {
    let quadro = document.getElementById('quadro-' + id);
    if (!quadro) {
      quadro = document.createElement('div');
      quadro.className = 'quadro-video';
      quadro.id = 'quadro-' + id;
      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      if (id === 'local') video.muted = true;
      quadro.appendChild(video);
      const rot = document.createElement('div');
      rot.className = 'rotulo';
      quadro.appendChild(rot);
      painelVideo.appendChild(quadro);
    }
    const video = quadro.querySelector('video');
    video.srcObject = stream;
    quadro.querySelector('.rotulo').textContent = nome + (ehTelaCompartilhada ? ' · tela' : '');
    quadro.classList.remove('sem-video');
  }

  function removerQuadro(id) {
    const quadro = document.getElementById('quadro-' + id);
    if (quadro) quadro.remove();
  }

  // ---------- WebRTC: criação de conexão ponto a ponto ----------
  function criarConexao(idRemoto, nomeRemoto, iniciador) {
    const pc = new RTCPeerConnection(configIce);
    conexoes[idRemoto] = pc;

    // envia meu áudio (e tela, se estiver compartilhando)
    if (streamMic) streamMic.getTracks().forEach(t => pc.addTrack(t, streamMic));
    if (streamTela) streamTela.getTracks().forEach(t => pc.addTrack(t, streamTela));

    pc.onicecandidate = (evento) => {
      if (evento.candidate) {
        socket.emit('sinal', { para: idRemoto, sinal: { tipo: 'ice', candidate: evento.candidate } });
      }
    };

    pc.ontrack = (evento) => {
      let ms = streamsRemotos[idRemoto];
      if (!ms) {
        ms = new MediaStream();
        streamsRemotos[idRemoto] = ms;
      }
      ms.addTrack(evento.track);
      const temVideo = ms.getVideoTracks().length > 0;
      if (temVideo) {
        criarOuAtualizarQuadro(idRemoto, nomeRemoto, ms, true);
      }
    };

    pc.onconnectionstatechange = () => {
      if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
        removerQuadro(idRemoto);
      }
    };

    if (iniciador) {
      pc.onnegotiationneeded = async () => {
        try {
          const oferta = await pc.createOffer();
          await pc.setLocalDescription(oferta);
          socket.emit('sinal', { para: idRemoto, sinal: { tipo: 'oferta', sdp: pc.localDescription } });
        } catch (e) { console.error(e); }
      };
    }

    return pc;
  }

  // ---------- Eventos de sinalização (Socket.IO) ----------
  socket.on('usuarios-na-sala', (usuarios) => {
    atualizarContagem(usuarios.length + 1);
    // Armazena os nomes de todos os usuários (para quando entrar na call)
    usuarios.forEach(u => { nomesRemotos[u.id] = u.nome; });
    // Só cria conexões WebRTC se já está na call
    if (naCall) {
      usuarios.forEach(u => criarConexao(u.id, u.nome, true));
    }
  });

  socket.on('novo-usuario', ({ id, nome }) => {
    nomesRemotos[id] = nome;
    adicionarMensagemSistema(nome + ' entrou na sala.');
    atualizarContagem(Object.keys(nomesRemotos).length + 1);
    // Só cria conexão WebRTC se já está na call
    if (naCall) {
      criarConexao(id, nome, false);
    }
  });

  socket.on('usuario-saiu', ({ id, nome }) => {
    if (conexoes[id]) { conexoes[id].close(); delete conexoes[id]; }
    delete streamsRemotos[id];
    delete nomesRemotos[id];
    removerQuadro(id);
    adicionarMensagemSistema((nome || 'alguém') + ' saiu da sala.');
    atualizarContagem(Object.keys(nomesRemotos).length + 1);
  });

  socket.on('sinal', async ({ de, sinal }) => {
    if (!naCall) return; // ignora sinais se não está na call
    let pc = conexoes[de];
    if (!pc) {
      pc = criarConexao(de, nomesRemotos[de] || 'convidado', false);
    }
    if (sinal.tipo === 'oferta') {
      await pc.setRemoteDescription(new RTCSessionDescription(sinal.sdp));
      const resposta = await pc.createAnswer();
      await pc.setLocalDescription(resposta);
      socket.emit('sinal', { para: de, sinal: { tipo: 'resposta', sdp: pc.localDescription } });
    } else if (sinal.tipo === 'resposta') {
      await pc.setRemoteDescription(new RTCSessionDescription(sinal.sdp));
    } else if (sinal.tipo === 'ice') {
      try { await pc.addIceCandidate(sinal.candidate); } catch (e) { console.error(e); }
    }
  });

  function atualizarContagem(n) {
    contagem.textContent = n + (n === 1 ? ' pessoa na sala' : ' pessoas na sala');
  }

  // ---------- Chat ----------
  formChat.addEventListener('submit', (e) => {
    e.preventDefault();
    const texto = inputChat.value.trim();
    if (!texto) return;
    socket.emit('mensagem-chat', { sala: minhaSala, nome: meuNome, texto });
    inputChat.value = '';
  });

  socket.on('mensagem-chat', ({ nome, texto, hora }) => {
    const div = document.createElement('div');
    div.className = 'msg';
    const h = new Date(hora);
    const horaTexto = h.getHours().toString().padStart(2, '0') + ':' + h.getMinutes().toString().padStart(2, '0');
    div.innerHTML = `<span class="nome">${escapeHtml(nome)}</span>${escapeHtml(texto)}<span class="hora">${horaTexto}</span>`;
    mensagens.appendChild(div);
    mensagens.scrollTop = mensagens.scrollHeight;
  });

  function adicionarMensagemSistema(texto) {
    const div = document.createElement('div');
    div.className = 'msg sistema';
    div.textContent = texto;
    mensagens.appendChild(div);
    mensagens.scrollTop = mensagens.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Microfone ----------
  let micAtivo = false;
  btnMic.addEventListener('click', async () => {
    if (!naCall) return;

    // Se não tem stream de mic ainda, tenta adquirir
    if (!streamMic) {
      try {
        streamMic = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        streamMic.getAudioTracks().forEach(t => t.enabled = true);
        micAtivo = true;
        btnMic.classList.add('ativo');
        btnMic.textContent = '🎤';
        // Adiciona as tracks nas conexões existentes
        Object.values(conexoes).forEach(pc => {
          streamMic.getTracks().forEach(t => pc.addTrack(t, streamMic));
        });
      } catch (e) {
        adicionarMensagemSistema('não foi possível acessar o microfone.');
        return;
      }
      return;
    }

    micAtivo = !micAtivo;
    streamMic.getAudioTracks().forEach(t => t.enabled = micAtivo);
    btnMic.classList.toggle('ativo', micAtivo);
    btnMic.textContent = micAtivo ? '🎤' : '🔇';
  });

  // ---------- Compartilhar tela ----------
  btnTela.addEventListener('click', async () => {
    if (!naCall) return;
    if (streamTela) {
      pararCompartilhamentoTela();
      return;
    }
    try {
      streamTela = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    } catch (e) {
      return; // usuário cancelou o seletor de tela
    }

    const trilhaTela = streamTela.getVideoTracks()[0];
    trilhaTela.onended = pararCompartilhamentoTela;

    // adiciona a trilha em todas as conexões existentes
    Object.values(conexoes).forEach(pc => pc.addTrack(trilhaTela, streamTela));

    criarOuAtualizarQuadro('local', meuNome, streamTela, true);
    btnTela.classList.add('ativo');
  });

  function pararCompartilhamentoTela() {
    if (!streamTela) return;
    const trilha = streamTela.getVideoTracks()[0];
    Object.values(conexoes).forEach(pc => {
      const remetente = pc.getSenders().find(s => s.track === trilha);
      if (remetente) pc.removeTrack(remetente);
    });
    streamTela.getTracks().forEach(t => t.stop());
    streamTela = null;
    removerQuadro('local');
    btnTela.classList.remove('ativo');
  }

  // ---------- Sair da sala ----------
  btnSair.addEventListener('click', () => {
    window.location.reload();
  });
})();
</script>
</body>
</html>
