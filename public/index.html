<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👀 sala — chat, voz e tela</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%80%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #060818;
    --bg-panel: #0a0e22;
    --bg-raised: #131a38;
    --line: #232c56;
    --text: #f3eefc;
    --text-dim: #8d92c0;
    --pink: #ff4fd0;
    --pink-soft: #ff8ce0;
    --pink-dim: #3a1240;
    --danger: #ff5f6d;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* ---------- Tela de entrada ---------- */
  #tela-entrada {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 18% 20%, rgba(255,79,208,0.10), transparent 42%),
      radial-gradient(circle at 82% 78%, rgba(120,90,255,0.08), transparent 42%),
      var(--bg);
  }
  .cartao-entrada {
    width: 340px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
  }
  .logo-emoji {
    font-size: 46px;
    line-height: 1;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 18px rgba(255,79,208,0.35));
  }
  .cartao-entrada h1 {
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 4px;
    font-weight: 600;
  }
  .cartao-entrada .sub {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 24px;
  }
  .campo { margin-bottom: 14px; text-align: left; }
  .campo label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .campo input {
    width: 100%;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
  }
  .campo input:focus { border-color: var(--pink); }
  #btn-entrar {
    width: 100%;
    margin-top: 8px;
    background: var(--pink);
    color: #21001b;
    border: none;
    border-radius: 6px;
    padding: 11px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: filter 0.15s;
  }
  #btn-entrar:hover { filter: brightness(1.08); }
  #erro-entrada { color: var(--danger); font-size: 12px; margin-top: 10px; min-height: 14px; }

  /* ---------- App principal ---------- */
  #app { display: none; height: 100vh; flex-direction: column; }

  #barra-topo {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--line);
  }
  #barra-topo .info-sala {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo-mini { font-size: 15px; }
  .ponto-vivo {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 0 3px var(--pink-dim);
  }
  #contagem { font-size: 12px; color: var(--text-dim); }

  #corpo { flex: 1; display: flex; min-height: 0; }

  /* Painel de vídeo/tela */
  #painel-video {
    flex: 1;
    padding: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    align-content: start;
    overflow-y: auto;
  }
  #painel-video:empty::before {
    content: 'Ninguém compartilhando tela no momento';
    grid-column: 1 / -1;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 40px 0;
  }
  .quadro-video {
    position: relative;
    background: #000;
    border: 1px solid var(--line);
    border-radius: 8px;
    aspect-ratio: 16/9;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .quadro-video video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #05060f;
  }
  .quadro-video .rotulo {
    position: absolute;
    bottom: 8px; left: 10px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--text);
    background: rgba(0,0,0,0.6);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* Chat lateral */
  #painel-chat {
    width: 300px;
    flex-shrink: 0;
    border-left: 1px solid var(--line);
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
  }
  #mensagens {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { font-size: 13px; line-height: 1.4; }
  .msg .nome {
    font-weight: 700;
    color: var(--pink);
    font-size: 12px;
    margin-right: 6px;
  }
  .msg .hora {
    color: var(--text-dim);
    font-size: 10px;
    margin-left: 6px;
  }
  .msg.sistema { color: var(--text-dim); font-style: italic; font-size: 12px; }
  #form-chat {
    display: flex;
    border-top: 1px solid var(--line);
    padding: 10px;
    gap: 8px;
  }
  #input-chat {
    flex: 1;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  #input-chat:focus { border-color: var(--pink); }
  #form-chat button {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #form-chat button:hover { border-color: var(--pink); }

  /* Barra de controles */
  #barra-controles {
    height: 66px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--bg-panel);
    border-top: 1px solid var(--line);
  }
  .botao-controle {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  .botao-controle:hover { border-color: var(--text-dim); }
  .botao-controle.ativo {
    background: var(--pink-dim);
    border-color: var(--pink);
    color: var(--pink-soft);
  }
  .botao-controle.indisponivel {
    opacity: 0.35;
    pointer-events: none;
  }
  .botao-controle.chamada { background: var(--pink); color: #21001b; border-color: var(--pink); }
  .botao-controle.chamada:hover { filter: brightness(1.08); }
  .botao-controle.chamada.ativo { background: var(--danger); border-color: var(--danger); color: #2a0004; }
  .botao-controle.sair {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .botao-controle.sair:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<!-- ===== Tela de entrada ===== -->
<div id="tela-entrada">
  <div class="cartao-entrada">
    <div class="logo-emoji">👀</div>
    <h1>entrar na sala</h1>
    <p class="sub">chat · voz · compartilhar tela</p>
    <div class="campo">
      <label for="input-nome">seu nome</label>
      <input id="input-nome" type="text" maxlength="20" placeholder="ex: joão" autocomplete="off">
    </div>
    <div class="campo">
      <label for="input-sala">código da sala</label>
      <input id="input-sala" type="text" maxlength="24" placeholder="ex: casa123" autocomplete="off">
    </div>
    <button id="btn-entrar">entrar</button>
    <div id="erro-entrada"></div>
  </div>
</div>

<!-- ===== App ===== -->
<div id="app">
  <div id="barra-topo">
    <div class="info-sala">
      <span class="logo-mini">👀</span>
      <span class="ponto-vivo"></span>
      <span id="rotulo-sala"></span>
    </div>
    <div id="contagem">1 pessoa na sala</div>
  </div>

  <div id="corpo">
    <div id="painel-video"></div>
    <div id="painel-chat">
      <div id="mensagens"></div>
      <form id="form-chat">
        <input id="input-chat" type="text" placeholder="mensagem..." autocomplete="off">
        <button type="submit">enviar</button>
      </form>
    </div>
  </div>

  <div id="barra-controles">
    <button class="botao-controle chamada" id="btn-chamada" title="entrar na chamada">📞</button>
    <button class="botao-controle indisponivel" id="btn-mic" title="microfone">🎤</button>
    <button class="botao-controle indisponivel" id="btn-tela" title="compartilhar tela">🖥️</button>
    <button class="botao-controle indisponivel ativo" id="btn-ruido" title="redução de ruído">🔉</button>
    <button class="botao-controle sair" id="btn-sair" title="sair">✕</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const socket = io();

  // ---------- Estado ----------
  let meuNome = '';
  let minhaSala = '';
  let emChamada = false;
  let streamMic = null;       // MediaStream do microfone (só existe durante a chamada)
  let streamTela = null;      // MediaStream da tela compartilhada (se ativo)
  let reducaoRuidoAtiva = true;
  const conexoes = {};        // socketId -> { pc, polite, makingOffer, ignoreOffer }
  const streamsRemotos = {};  // socketId -> MediaStream combinada recebida
  const nomesRemotos = {};    // socketId -> nome (conhecido desde a entrada no chat)

  const configIce = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  // ---------- Elementos ----------
  const telaEntrada = document.getElementById('tela-entrada');
  const app = document.getElementById('app');
  const inputNome = document.getElementById('input-nome');
  const inputSala = document.getElementById('input-sala');
  const btnEntrar = document.getElementById('btn-entrar');
  const erroEntrada = document.getElementById('erro-entrada');
  const rotuloSala = document.getElementById('rotulo-sala');
  const contagem = document.getElementById('contagem');
  const painelVideo = document.getElementById('painel-video');
  const mensagens = document.getElementById('mensagens');
  const formChat = document.getElementById('form-chat');
  const inputChat = document.getElementById('input-chat');
  const btnChamada = document.getElementById('btn-chamada');
  const btnMic = document.getElementById('btn-mic');
  const btnTela = document.getElementById('btn-tela');
  const btnRuido = document.getElementById('btn-ruido');
  const btnSair = document.getElementById('btn-sair');

  // ---------- Entrada na sala (só chat, sem pedir mic/câmera) ----------
  btnEntrar.addEventListener('click', entrarNaSala);
  inputSala.addEventListener('keydown', e => { if (e.key === 'Enter') entrarNaSala(); });

  function entrarNaSala() {
    const nome = inputNome.value.trim();
    const sala = inputSala.value.trim().toLowerCase().replace(/\s+/g, '-');
    if (!nome || !sala) {
      erroEntrada.textContent = 'preencha seu nome e o código da sala.';
      return;
    }

    meuNome = nome;
    minhaSala = sala;

    telaEntrada.style.display = 'none';
    app.style.display = 'flex';
    rotuloSala.textContent = sala;

    socket.emit('entrar-sala', { sala, nome });
  }

  // ---------- Quadros de vídeo (tela compartilhada) ----------
  function criarOuAtualizarQuadro(id, nome, stream) {
    let quadro = document.getElementById('quadro-' + id);
    if (!quadro) {
      quadro = document.createElement('div');
      quadro.className = 'quadro-video';
      quadro.id = 'quadro-' + id;
      const video = document.createElement('video');
      video.autoplay = true;
      video.playsInline = true;
      if (id === 'local') video.muted = true;
      quadro.appendChild(video);
      const rot = document.createElement('div');
      rot.className = 'rotulo';
      quadro.appendChild(rot);
      painelVideo.appendChild(quadro);
    }
    const video = quadro.querySelector('video');
    if (video.srcObject !== stream) video.srcObject = stream;
    quadro.querySelector('.rotulo').textContent = nome + ' · tela';
  }

  function removerQuadro(id) {
    const quadro = document.getElementById('quadro-' + id);
    if (quadro) quadro.remove();
  }

  // ---------- WebRTC: negociação perfeita (funciona nos dois sentidos) ----------
  // Sem isso, só quem "iniciou" a conexão conseguia renegociar ao adicionar uma
  // nova trilha (como a tela compartilhada) — por isso só um lado enxergava a tela.
  function criarConexao(idRemoto, nomeRemoto, souIniciador) {
    const pc = new RTCPeerConnection(configIce);
    const estado = { pc, polite: !souIniciador, makingOffer: false, ignoreOffer: false };
    conexoes[idRemoto] = estado;
    nomesRemotos[idRemoto] = nomeRemoto;

    if (streamMic) streamMic.getTracks().forEach(t => pc.addTrack(t, streamMic));
    if (streamTela) streamTela.getTracks().forEach(t => pc.addTrack(t, streamTela));

    pc.onicecandidate = (evento) => {
      if (evento.candidate) {
        socket.emit('sinal', { para: idRemoto, sinal: { tipo: 'ice', candidate: evento.candidate } });
      }
    };

    pc.ontrack = (evento) => {
      let ms = streamsRemotos[idRemoto];
      if (!ms) { ms = new MediaStream(); streamsRemotos[idRemoto] = ms; }
      ms.addTrack(evento.track);
      evento.track.onended = () => {
        ms.removeTrack(evento.track);
        if (ms.getVideoTracks().length === 0) removerQuadro(idRemoto);
      };
      if (ms.getVideoTracks().length > 0) criarOuAtualizarQuadro(idRemoto, nomeRemoto, ms);
    };

    pc.onconnectionstatechange = () => {
      if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) removerQuadro(idRemoto);
    };

    pc.onnegotiationneeded = async () => {
      try {
        estado.makingOffer = true;
        const oferta = await pc.createOffer();
        await pc.setLocalDescription(oferta);
        socket.emit('sinal', { para: idRemoto, sinal: { tipo: 'oferta', sdp: pc.localDescription } });
      } catch (e) {
        console.error(e);
      } finally {
        estado.makingOffer = false;
      }
    };

    return estado;
  }

  function fecharConexao(id) {
    if (conexoes[id]) { conexoes[id].pc.close(); delete conexoes[id]; }
    delete streamsRemotos[id];
    removerQuadro(id);
  }

  // ---------- Eventos de sinalização (Socket.IO) ----------
  socket.on('usuarios-na-sala', (usuarios) => {
    usuarios.forEach(u => { nomesRemotos[u.id] = u.nome; });
    atualizarContagem(usuarios.length + 1);
  });

  socket.on('novo-usuario', ({ id, nome }) => {
    nomesRemotos[id] = nome;
    adicionarMensagemSistema(nome + ' entrou na sala.');
    atualizarContagem(Object.keys(nomesRemotos).length + 1);
  });

  socket.on('usuario-saiu', ({ id, nome }) => {
    fecharConexao(id);
    delete nomesRemotos[id];
    adicionarMensagemSistema((nome || 'alguém') + ' saiu da sala.');
    atualizarContagem(Object.keys(nomesRemotos).length + 1);
  });

  // ---- Canal de voz/tela (só entra quem clicou em 📞) ----
  socket.on('usuarios-na-voz', (usuarios) => {
    usuarios.forEach(u => criarConexao(u.id, u.nome, true));
  });

  socket.on('novo-usuario-voz', ({ id, nome }) => {
    if (!emChamada) return;
    criarConexao(id, nome, false);
  });

  socket.on('usuario-saiu-voz', ({ id }) => {
    fecharConexao(id);
  });

  socket.on('sinal', async ({ de, sinal }) => {
    let estado = conexoes[de];
    if (!estado) estado = criarConexao(de, nomesRemotos[de] || 'convidado', false);
    const { pc, polite } = estado;

    if (sinal.tipo === 'oferta') {
      const colisao = estado.makingOffer || pc.signalingState !== 'stable';
      estado.ignoreOffer = !polite && colisao;
      if (estado.ignoreOffer) return;

      if (colisao) {
        await Promise.all([
          pc.setLocalDescription({ type: 'rollback' }),
          pc.setRemoteDescription(new RTCSessionDescription(sinal.sdp))
        ]);
      } else {
        await pc.setRemoteDescription(new RTCSessionDescription(sinal.sdp));
      }
      const resposta = await pc.createAnswer();
      await pc.setLocalDescription(resposta);
      socket.emit('sinal', { para: de, sinal: { tipo: 'resposta', sdp: pc.localDescription } });
    } else if (sinal.tipo === 'resposta') {
      await pc.setRemoteDescription(new RTCSessionDescription(sinal.sdp));
    } else if (sinal.tipo === 'ice') {
      try { await pc.addIceCandidate(sinal.candidate); }
      catch (e) { if (!estado.ignoreOffer) console.error(e); }
    }
  });

  function atualizarContagem(n) {
    contagem.textContent = n + (n === 1 ? ' pessoa na sala' : ' pessoas na sala');
  }

  // ---------- Chat ----------
  formChat.addEventListener('submit', (e) => {
    e.preventDefault();
    const texto = inputChat.value.trim();
    if (!texto) return;
    socket.emit('mensagem-chat', { sala: minhaSala, nome: meuNome, texto });
    inputChat.value = '';
  });

  socket.on('mensagem-chat', ({ nome, texto, hora }) => {
    const div = document.createElement('div');
    div.className = 'msg';
    const h = new Date(hora);
    const horaTexto = h.getHours().toString().padStart(2, '0') + ':' + h.getMinutes().toString().padStart(2, '0');
    div.innerHTML = `<span class="nome">${escapeHtml(nome)}</span>${escapeHtml(texto)}<span class="hora">${horaTexto}</span>`;
    mensagens.appendChild(div);
    mensagens.scrollTop = mensagens.scrollHeight;
  });

  function adicionarMensagemSistema(texto) {
    const div = document.createElement('div');
    div.className = 'msg sistema';
    div.textContent = texto;
    mensagens.appendChild(div);
    mensagens.scrollTop = mensagens.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- Entrar / sair da chamada (opt-in — nada disso acontece sozinho) ----------
  btnChamada.addEventListener('click', () => {
    if (emChamada) sairDaChamada(); else entrarNaChamada();
  });

  async function entrarNaChamada() {
    if (emChamada) return;
    try {
      streamMic = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: reducaoRuidoAtiva,
          autoGainControl: true
        },
        video: false
      });
    } catch (e) {
      // Sem microfone (permissão negada ou indisponível) — segue mesmo assim,
      // só ouvindo e podendo compartilhar tela.
      streamMic = null;
    }

    emChamada = true;
    socket.emit('entrar-voz', { sala: minhaSala });
    atualizarUiChamada();
  }

  function sairDaChamada() {
    if (!emChamada) return;
    if (streamTela) pararCompartilhamentoTela();

    Object.keys(conexoes).forEach(fecharConexao);

    if (streamMic) {
      streamMic.getTracks().forEach(t => t.stop());
      streamMic = null;
    }

    emChamada = false;
    socket.emit('sair-voz', { sala: minhaSala });
    atualizarUiChamada();
  }

  function atualizarUiChamada() {
    btnChamada.classList.toggle('ativo', emChamada);
    btnChamada.textContent = emChamada ? '📵' : '📞';
    btnChamada.title = emChamada ? 'sair da chamada' : 'entrar na chamada';

    [btnMic, btnTela, btnRuido].forEach(b => b.classList.toggle('indisponivel', !emChamada));

    if (emChamada) {
      btnMic.classList.toggle('indisponivel', !streamMic);
      btnMic.textContent = streamMic ? '🎤' : '🔇';
      btnMic.title = streamMic ? 'microfone' : 'microfone indisponível';
      btnRuido.classList.toggle('indisponivel', !streamMic);
    }
  }

  // ---------- Microfone ----------
  let micAtivo = true;
  btnMic.addEventListener('click', () => {
    if (!emChamada || !streamMic) return;
    micAtivo = !micAtivo;
    streamMic.getAudioTracks().forEach(t => t.enabled = micAtivo);
    btnMic.classList.toggle('ativo', micAtivo);
    btnMic.textContent = micAtivo ? '🎤' : '🔇';
  });

  // ---------- Redução de ruído ----------
  btnRuido.addEventListener('click', async () => {
    if (!emChamada || !streamMic) return;
    reducaoRuidoAtiva = !reducaoRuidoAtiva;
    const trilha = streamMic.getAudioTracks()[0];
    try {
      await trilha.applyConstraints({ noiseSuppression: reducaoRuidoAtiva });
    } catch (e) {
      console.warn('este navegador não permite alternar a redução de ruído em tempo real', e);
    }
    btnRuido.classList.toggle('ativo', reducaoRuidoAtiva);
    btnRuido.textContent = reducaoRuidoAtiva ? '🔉' : '🔊';
    btnRuido.title = reducaoRuidoAtiva ? 'redução de ruído: ativada' : 'redução de ruído: desativada';
  });

  // ---------- Compartilhar tela ----------
  btnTela.addEventListener('click', async () => {
    if (!emChamada) return;
    if (streamTela) { pararCompartilhamentoTela(); return; }

    try {
      streamTela = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    } catch (e) {
      return; // usuário cancelou o seletor de tela
    }

    const trilhaTela = streamTela.getVideoTracks()[0];
    trilhaTela.onended = pararCompartilhamentoTela;

    // Adiciona a trilha em todas as conexões — o onnegotiationneeded cuida de
    // avisar o outro lado, não importa quem começou a chamada.
    Object.values(conexoes).forEach(estado => estado.pc.addTrack(trilhaTela, streamTela));

    criarOuAtualizarQuadro('local', meuNome, streamTela);
    btnTela.classList.add('ativo');
  });

  function pararCompartilhamentoTela() {
    if (!streamTela) return;
    const trilha = streamTela.getVideoTracks()[0];
    Object.values(conexoes).forEach(estado => {
      const remetente = estado.pc.getSenders().find(s => s.track === trilha);
      if (remetente) estado.pc.removeTrack(remetente);
    });
    streamTela.getTracks().forEach(t => t.stop());
    streamTela = null;
    removerQuadro('local');
    btnTela.classList.remove('ativo');
  }

  // ---------- Sair da sala ----------
  btnSair.addEventListener('click', () => {
    window.location.reload();
  });
})();
</script>
</body>
</html>
